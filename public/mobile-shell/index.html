<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b3022" />
    <title>LK Studio</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: "Segoe UI", system-ui, sans-serif;
        text-align: center;
        color: #f5f0e6;
        background:
          radial-gradient(ellipse 80% 60% at 50% 0%, #2a4535 0%, transparent 55%),
          linear-gradient(165deg, #1b3022 0%, #14241a 55%, #1b3022 100%);
      }
      .mark {
        font-size: clamp(1.75rem, 6vw, 2.25rem);
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        margin: 0 0 0.5rem;
      }
      .tag {
        margin: 0;
        font-size: 0.85rem;
        letter-spacing: 0.04em;
        opacity: 0.85;
      }
      .pulse {
        width: 2rem;
        height: 2rem;
        margin: 1.75rem auto 0;
        border: 2px solid rgba(245, 240, 230, 0.25);
        border-top-color: #c9a227;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div>
      <p class="mark">LK Studio</p>
      <p class="tag">Grow your business with less effort</p>
      <div class="pulse" aria-hidden="true"></div>
    </div>
  </body>
</html>
