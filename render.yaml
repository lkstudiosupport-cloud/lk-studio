# Render Blueprint — optional; existing services: set Health Check Path to /api/health in Dashboard.
services:
  - type: web
    name: lk-studio
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NODE_ENV
        value: production
