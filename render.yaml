# Render Blueprint — optional; existing services: set Health Check Path to /api/health in Dashboard.
services:
  - type: web
    name: lk-studio
    runtime: node
    plan: free
    # Schema patches at build (not on every cold start) so next start listens ASAP.
    buildCommand: npm install && npm run build && npx tsx scripts/ensure-production-schema.ts
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--dns-result-order=ipv4first"
