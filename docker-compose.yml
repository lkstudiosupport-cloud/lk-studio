# Local PostgreSQL for development (production: use Neon, Supabase, etc.)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: lkstudio
      POSTGRES_PASSWORD: lkstudio
      POSTGRES_DB: lkstudio
    volumes:
      - lkstudio_pg:/var/lib/postgresql/data

volumes:
  lkstudio_pg:
